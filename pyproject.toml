[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aj-llm-layer"
version = "0.1.0"
description = "Independent, privacy-first adaptive LLM routing infrastructure"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "redis>=5.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
include = ["aj_llm_layer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"aj_llm_layer.certification" = ["*.json"]
